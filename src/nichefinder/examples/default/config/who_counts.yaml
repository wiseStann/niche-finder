  okved: ["68.20", "68.32"]
  note: "private landlords are mostly individuals: a floor; 68.20 also includes commercial lessors"
small-nonprofits-donor-crm:
  naics: ["8132", "8133", "8134"]
  note: "grantmaking, advocacy and civic organisations with employees; volunteer-only nonprofits are not counted"
churches-tools:
