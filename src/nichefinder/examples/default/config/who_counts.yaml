# How many target businesses exist per niche: the "who" of who x task x product, counted in official registers.
# Read by s8_who_counts (US: Census County Business Patterns and Nonemployer Statistics) and ru_msp_counts
# (Russia: the FNS register of small and medium businesses, by main activity code).
#
#   niche_id:
#     naics: [codes]   NAICS 2017 codes as used by CBP 2023. A code matches itself; "8111" is the 4-digit group.
#     okved: [codes]   OKVED2 main-activity codes. A code matches its whole subtree ("43.2" counts 43.21, 43.22.1 ...; "45.20" counts 45.20.1).
#     note:  what the codes leave out or overcount. Say it plainly: the count is a ceiling or a floor, never "the market".
#
# Only niches whose buyers are businesses of one industry belong here. "Any local business" niches (SMS marketing,
# AI phone receptionist, digital signage) and audiences that are not firms (Shopify merchants, website owners,
# creators) are left out on purpose: a register cannot count them.
# Russian non-profit and religious organisations are not small businesses in the register, so those niches have no okved.
# Self-employed people on the professional income tax (NPD) are not in the register either: for trades where most
# workers are self-employed (beauty masters, tutors, home bakers) the Russian number is a floor.
# This is a hand-kept map, like startpack_map.yaml. Fix a code when the passport shows a number that cannot be right.

pet-care-facilities:
  naics: ["812910"]
  okved: ["96.09"]
  note: "OKVED 96.09 is all other personal services, so the Russian number is a ceiling"
gym-martial-arts-studios:
  naics: ["713940", "611620"]
  okved: ["93.13", "85.41.1"]
  note: "fitness centres plus sports instruction (martial arts schools)"
