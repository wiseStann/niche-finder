# Topic of each niche for YouTube search interest (Google Trends, gprop=youtube), used by s8_youtube_trends.
# People search YouTube for a subject ("bible study", "meal prep"), not for a product ("bible app" is about 0),
# so the phrases are subjects, not "X app". B2B subjects are almost always about 0 on YouTube and come out as NA:
# that is a result, not a gap.
#
# Optional settings (the reserved `_settings` key):
#   ref        reference topic requested together with every niche topic; level = niche / ref. A mid-level topic
#              works best (level 1.0); default budgeting.
#   last_year  last full calendar year of the 4-year window (default: the year before the run date). The level is
#              measured on that year and the trend compares it with two years earlier.
# _settings:
#   ref: budgeting
#   last_year: 2024
