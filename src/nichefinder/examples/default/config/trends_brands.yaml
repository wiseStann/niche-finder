# Brand anchors for Google Trends (S4), per niche id.
# Why: B2B niches often have a narrow anchor with a Trends index below 5 (NA), and a single broad "X software"
# phrase can be misleading (a one-off hump). s5_merge applies the rule: if the anchor / broad phrase verdict is
# DOWN or NA, take the majority over brands with a signal (mean_2024 >= 5):
#   broad DOWN + brands not DOWN -> FLAT (the category decline is not confirmed by brands);
#   broad NA + brands present -> the brands' verdict.
# Pick the 3-4 leading products of the category (from Capterra / GetApp). A hand-kept list.

