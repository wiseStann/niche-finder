# Info-product topics: the `info` cohort (short video -> Telegram channel -> micro product).
# One topic = one niche (who x task x product) measured by what people watch in YouTube Shorts, not by what they
# search for. Stages: info_suggest (topic ideas from the seeds), info_youtube (measurement), info_score (score + report).
# Thresholds and weights: config/score_info.yaml. Method: docs/methodology.md, "Info" and section 7.6.

_settings:
  lang: ru              # YouTube relevanceLanguage and autocomplete language; with ru only Cyrillic titles are kept
  region: RU            # YouTube regionCode and autocomplete country
  window_months: 12     # videos published in this window, counted from the first day of the run month
  # Broad areas for info_suggest: each seed is expanded through YouTube autocomplete ("seed", "seed a", "seed b", ...)
  # into data/out/info_suggest.csv. Pick the phrases that name a concrete task and turn them into topics below.
  seeds: []

# One phrase per topic: the subject as people name it, in 1-3 words ("sales on avito", "burnout"), not a how-to
# question ("burnout at work what to do") and not the product ("avito course"). Short-video audiences gather around a
# subject, and a long phrase shrinks the pool: on the first real run "X what to do" phrases gave medians of 1-2k
# views against 30-180k for subject phrases, which would rank phrasing, not topics. Each phrase costs one YouTube
# search (100 of the 10,000 daily units), so about 90 one-phrase topics fit into a day.
# The search takes the most viewed videos, so a broad phrase pulls in viral videos that only mention its words:
# `must` keeps only videos whose title or description names it in words (hashtags do not count: Shorts stuff them
# for reach), `must_not` drops the ones that match it anywhere, hashtags included. Both are optional,
# case-insensitive regexes; avoid short stems that hide inside other words ("ног" is inside "много"). Check the
# examples in reports/info.md before trusting a number.
topics: []
