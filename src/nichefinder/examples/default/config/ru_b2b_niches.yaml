# --- Control niches (added 2026-11-25, expectations fixed before they were measured) ---------------------------------------
# `control: red` = a market a small team should not enter (a monopoly, an oligopoly of giants, or a crowd with free tiers);
# `control: green` = should pass (demand, several vendors of comparable size, small teams selling self-serve).
# Controls are scored against the cohort but stay out of its percentiles and median (as in S6-RU). If a control gets the wrong
# colour, suspect the formula, not the control (methodology, principle 5). Three of them mirror the global controls
# ctrl-smb-crm, ctrl-task-manager and ctrl-website-builder, which are red in S3/S6 and S6-RU.

