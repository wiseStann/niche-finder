# Russian B2B niche universe (market `ru`). A separate branch: the global tools (Keyword Planner, App Store, Capterra) do not see
# Russian B2B, and Wordstat category phrases are close to zero because demand lives in brand searches. Five measures per niche:
#   reestr    - domestic software register (reestr.digital.gov.ru): search by product name -> products, new per year, AI flag   (supply)
#   bitrix    - Bitrix24 Market: search -> apps, installs, leader share                                                         (supply inside the SMB platform)
#   zakupki   - zakupki.gov.ru: exact phrase, last 12 months vs the 12 before -> procurements and RUB                           (demand with money, B2B/B2G)
#   hh_roles  - hh.ru: vacancies for the role the product automates ("secretary on the phone", "estimator")                     (labour = automation potential)
#   hh_brands - hh.ru: vacancies that name a brand                                                                              (adoption)
#   ws_brands / ws_cat / ws_dyn - Wordstat: sum of brands = category size; category phrases; 36-month dynamics                  (demand, trend)
# Search terms are Russian on purpose (they are queries against Russian sites); everything else is English.
# stack_fit 0-3 is your own judgment of how well a niche fits your technical stack (3 = same stack, 0 = outside your competence).
# It is shown beside the score and is not part of it. Every niche ships with the neutral 1; set your own.
# `product` prices are rough pointers from vendor sites (RUB per month per site/user); verify them when shortlisting.

