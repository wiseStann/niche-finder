  reestr: [голосовой робот, голосовой помощник, голосовой ассистент, робот для обзвона, автоответчик]
  bitrix: [голосовой робот, автоответчик, робот обзвон]
  zakupki: [голосовой робот, голосовой помощник, робот для обзвона]
  hh_roles: [оператор входящих звонков, секретарь на телефоне, оператор call-центра]
  hh_brands: [звонобот, voximplant, twin]
  ws_brands: [звонобот, voximplant, twin ai, neuro.net, робот макс]
