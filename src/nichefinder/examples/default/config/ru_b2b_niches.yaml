  ws_brands: [битрикс24, amocrm, амо crm, retailcrm, мегаплан, envycrm]
  ws_brand_names: {амо crm: amocrm}
  ws_cat: [crm для малого бизнеса, crm система, простая crm для малого бизнеса]
  ws_dyn: crm система
