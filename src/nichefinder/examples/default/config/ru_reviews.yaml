# Russian reviews (S10): what users of the leading products of a niche write in the Russian App Store, Google Play and
# Startpack (business software; which products: config/startpack_map.yaml).
# Read by s10_ru_reviews_fetch (`fetch`), s10_ru_reviews_classify (`sample`) and s10_ru_reviews_report (`verdict`).
# Rationale: docs/methodology.md section 9.
#
# status: draft until the thresholds are fixed. Fix them BEFORE reading the first real verdicts (set `status: fixed`
# and `fixed_on`); after that every change needs a written reason in `changes`, never to rescue a favourite niche.
status: draft
fixed_on:
changes:
  - date: 2026-11-21
    what: "gap counts an unmet need only in a review rated low_rating or lower; fewer than min_low_reviews such reviews -> unmeasured"
    why: >-
      Draft trial (11 niches): the control ctrl-task-manager, an expected saturated market, had the highest unmet share
      of the B2B cohort (32 %). 34 of its 42 missing-feature reviews were five-star wishlists (Startpack asks every reviewer
      for cons; 90 % of Startpack reviews are five-star), and all 31 switches were arrivals from Trello, Jira or Asana,
      a sign that substitutes exist. Dropping feature wishes alone did not help (price + switching: still first in B2B, 15 %);
      counting only reviews of 3 stars or lower gives the control 2 %. The floors were not changed.

fetch:
  window_months: 12       # reviews older than this, counted back from the run date, are dropped
  apps_per_store: 8       # per niche and store: the relevant apps with the most ratings
  min_ratings: 20         # skip apps with fewer store ratings (no review history to speak of)
  appstore_pages: 10      # App Store RSS: 50 newest reviews a page; Apple serves 10 pages at most
  gplay_reviews: 500      # Google Play: newest Russian reviews per app
  startpack_window_months: 36   # Startpack: B2B products collect reviews slowly; in a 24-month window half of the B2B
                                # niches tried on 2026-11-20 had fewer than 80 reviews
  startpack_pages: 4      # Startpack: 50 newest reviews a page
  startpack_min_reviews: 5   # Startpack products taken from `categories` need at least this many reviews

sample:
  max_reviews: 240        # per niche, taken round-robin over its apps; the LLM labels 12 reviews per call
  min_chars: 40           # shorter reviews ("Super!", "Does not work") name no pain and are not sent to the LLM

# Verdict: a rule, not a score; it does not change the S6 verdict. Shares are over reviews about the app itself.
# Written reviews lean negative (the unhappy user is the one who writes), so the rule compares niches with each other:
# a share must be in the top third of the cohort (mid-rank percentile) AND above an absolute floor. Cohorts are per segment
# (B2C + prosumer, B2B), because the sources differ: app stores for B2C, mostly Startpack for B2B, which leans positive.
# The gap share counts an unmet need (missing feature, price, switching) only in an unhappy review (low_rating or lower),
# over all reviews about the app: a wish in a five-star review is a wishlist, a switch in one is an arrival from a rival.
verdict:
  min_app_reviews: 80     # quiet: fewer classified reviews about the app itself
  min_apps: 2             # quiet: fewer apps with substantive reviews in the sample
  min_cohort: 6           # with fewer measured niches in a segment percentiles mean nothing: the floors alone decide
  low_rating: 3           # an unhappy review: rated this many stars or fewer
  min_low_reviews: 30     # unmeasured: fewer unhappy reviews about the app; the gap cannot be read (not "content"), and
                          # the niche is left out of the gap percentiles. Startpack reviews are 90 % five-star
  gap_pct: 0.67           # gap: unmet needs in unhappy reviews, as a share of all reviews about the app, in the top third...
  gap_floor: 0.15         # ...and at least this share
  quality_pct: 0.67       # quality: complaints about bugs, UX, ads and support in the top third...
  quality_floor: 0.30     # ...and at least this share
  content_praise: 0.50    # content: praise at least this share, the gap readable, and neither gap nor quality
  top_app_warn: 0.60      # a caution in the reason (not a gate) when one product gives more of the sample than this:
                          # Startpack reviews come in vendor campaigns, so one product can be most of a B2B niche's voice
