# Per-niche manual judgments (everything the data stages cannot measure). Keyed by niche id from niches.yaml.
# A niche may be missing or have only some fields; defaults are in brackets.
#
#   platform_risk  0 - no free native / platform feature covers the task; 1 - partially covered; 2 - covered (gate G3: red).
#   platform_note  one line: which platform feature, and what it leaves open.
#   lock_in        0 - data is easy to export / leave; 1 - accumulated data or integrations; 2 - annual contracts + data.  [1]
#   feas           feasibility for a small team, four 0/1 checks (gate G5: the sum must be >= 2):
#                  indie_exists, stack_commodity, no_regulated_data, self_serve.
#   feas_note      evidence for the feasibility checks (who already does it with a small team).
#   supply_manual  for niches where the Capterra / App Store category is a weak proxy (gate S5 = NA): a short manual estimate
#                  of who the players are. Presence of this field turns an unmeasured S5 gate into PASS*.
#   lens           optional free text for the passport: distribution, what the next model release changes, switching cost,
#                  regulation, repeatability, accumulation.
#   fit            founder fit 0-3 for the path-to-goal grade [nf.yaml default_fit]: 3 - stack or domain transfer directly;
#                  2 - same shape of product, experience shortens the path; 1 - ordinary app, learn everything; 0 - needs
#                  physical work, licences or partnerships outside your competence (grade C).
#   fit_note       one line of justification.
#   size_override  payers in the niche (number), for niches with no App Store / Capterra / Shopify proxy, where the search proxy
#                  understates the market by 10-100x. A manual estimate: verify against the players' own sites.
#   size_note      where the estimate comes from.
#   excluded       true - leave the niche out of the path-to-goal grading (grade "—").
#   verdict        OPTIONAL manual verdict (green / yellow). Without it the verdict is automatic: gates failed -> red;
#                  otherwise green when score >= nf.yaml verdict.green_min_score, else yellow. Gates always win.
#   verdict_note   OPTIONAL text shown next to the verdict (used with `verdict`).

pet-care-facilities:
