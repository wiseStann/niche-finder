  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "Wholesale Helper (US, small), B2B Wholesale Club (Canada, indie), Sami and BSS (app factories, review leaders), SparkLayer (UK, VC-lite); the stack is Shopify Functions and customer accounts (commodity)"
  lens: "Distribution: the app store plus agencies (B2B projects are agency-led). The model release is not a threat. Switching is painful (price lists, customers, terms). Monetization $20-100/month, 96% with a free plan; accumulation is B2B customers and prices."

shopify-search-filter-menus:
  platform_risk: 2
  platform_note: "The platform's first-party Search & Discovery (free, 2022) covers filters, synonyms and recommendations, with semantic search since 2024; mega-menus are partly in themes; apps remain for complex catalogs (500+ SKUs, AI ranking, merchandising)"
  lock_in: 1
  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "Smart Product Filter (Globo, Vietnam), Boost Commerce (Vietnam, mid), Searchanise (small), Doofinder (Spain, VC-backed), Fast Simon (VC-backed) and Qikify/Buddha (indie mega-menu)"
  lens: "Distribution: the app store. Switching is moderate (configured filters). Monetization $10-100/month by product count; accumulation is configuration."

phone-as-security-baby-camera:
  platform_risk: 1
  platform_note: "There is no native 'camera from a second phone' (the OS continuity camera is a webcam for desktop); the main substitute is hardware: $20-30 home cameras with a free app cover home monitoring"
  lock_in: 0
  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "AlfredCamera (Taiwan, 70M+ installs, 111k US ratings) has led since 2015; Annie/Nancy Baby Monitor (Czechia, small), Bibino, Cloud Baby Monitor and Nani are indie; the stack is WebRTC and cloud (commodity, but traffic and storage cost money)"
  lens: "Distribution: ASO ('baby monitor', 'security camera'), parent word of mouth. The model release is not a threat. Switching is instant; median subscription $9.99/month, all 8 top apps monetized; no accumulation."

star-maps-astronomy-apps:
  platform_risk: 0
  platform_note: "No native planetariums; free open-source Stellarium (desktop) and an abandoned sky-map app cover the basic scenario"
  lock_in: 0
  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "Sky Guide (3 people), Night Sky (small studio) and Stellarium Mobile (2 people) are indie leaders since 2011-2013; one publisher (Vito Technology) holds about 26% of US ratings and 64% of RU across four apps"
  lens: "Distribution: ASO and seasonality (meteor showers, eclipses, comets). The model release is not a threat (AR plus an object catalog). Switching is instant; weak monetization: one-off purchases of $3-5, subscriptions in 1 of 8 apps, median $0.99/month; no accumulation."

family-chore-reward-apps:
  platform_risk: 1
  platform_note: "OS reminders and task apps share lists within a family but without rewards or points; family calendars (Cozi with 399k ratings, FamilyWall) bundle chore checklists"
  lock_in: 1
  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "Chorsee (indie, 2022, 11.7k ratings), Neat Kid (2024, 0.9k), Chorly and MyChoreBoard are an indie wave of 2022-26; Joon (ADHD kids, VC-backed) enters through a segment; Greenlight and BusyKid are kids' debit cards (regulated finance, out of scope)"
  lens: "Distribution: ASO, parent communities (r/Parenting 6M), school and ADHD niches. The model release is not a threat. Switching is painful once points and habits accumulate (moderate lock-in); median subscription $6.99/month, all 8 top apps monetized; accumulation is the child's reward history."

bedtime-stories-kids-audio:
  platform_risk: 1
  platform_note: "Free substitutes: video kids apps, music-streaming audio stories, general chat assistants generate a story on request; no specialized native product from audiobook platforms for children"
  lock_in: 0
  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "Little Stories (Diveo Media, Estonia, indie, 46k US ratings, #1 in RU results), Readmio (Czechia, small), Zoog (Israel), Storytime AI, Okudu and WunderKind are AI generators of 2023-25; RU: Storiko, Gusgus, MySkazka and a free ad-supported bedtime-story factory; the stack is TTS + LLM (commodity)"
  lens: "Distribution: ASO, parent communities, RU via Google Play with an ad model. The model release is a partial threat (an LLM generates text; the value is voice, characters and ritual). Switching is instant; median subscription $9.99/month, 7 of 8 monetized; weak accumulation (library of heard stories)."

travel-esim-apps:
  platform_risk: 1
  platform_note: "Phone vendors promote eSIM (eSIM-only phones in the US since 2022) and carriers sell roaming packs in their apps; platforms have no native eSIM store (Apple shows a provider list in settings: distribution, not replacement)"
  lock_in: 0
  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "Entry without a telecom license through aggregators (eSIM Go, Telna, 1GLOBAL, Airalo Partner): a white-label store in weeks; a listing on Flippa for a 'fully automated eSIM store' at $730/month; 19 new apps in 12 months in the US App Store, none reached 1k ratings, so entry through ASO is closed and an own channel is needed"
  lens: "Distribution: SEO content ('esim for japan'), travel-blogger affiliate programs, comparison sites, ASO. The model release is not a threat. Switching cost is zero (a purchase per trip), so competition is on price and brand. Transactional monetization: 20-40% margin on a $5-30 pack, repeat purchase on each trip; no accumulation (no lock-in), but repeat purchases at the leaders are high."
