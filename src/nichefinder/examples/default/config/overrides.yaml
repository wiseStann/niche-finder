  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "EqualWeb, Accessibly and Adally are small teams; but UserWay was bought by Level Access (2024) and AudioEye is public; reputational risk for a newcomer"
  supply_manual: "Unverified estimate: accessiBe (leader, about 50%), UserWay/Level Access, AudioEye, EqualWeb, Accessibly, Adally, MaxAccess, All in One Accessibility: 8 players, consolidating."
  lens: "Demand comes from ADA lawsuits and the EU accessibility act (June 2025), a regulatory tailwind, but the overlay product is discredited (regulator action, lawsuits against the leader's customers), the leader holds 51%, and the category is consolidating. An honest alternative is audit and remediation, a different niche that needs expertise."

shopify-upsell-bundles:
  platform_risk: 1
  platform_note: "The platform's free first-party Bundles app (2023) covers simple fixed bundles; upsells in cart, checkout and post-purchase remain for apps; app store commission is 0% up to $1M per year"
  lock_in: 0
  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "Kaching Bundles (small team, 5.9k reviews), Bundler (2 people), Selleasy and Essential Apps are indie successes; the stack is Shopify Functions and Checkout Extensions (commodity)"
  lens: "Distribution: search inside the app store (not Google: Trends NA, KP 1.5k) plus agencies and platform partners. AI recommendations become a feature. Switching is instant (install or uninstall), a low barrier both ways. Monetization: $10-50/month and/or a percentage of upsell revenue (transactional); weak accumulation (offer settings)."

shopify-loyalty-rewards:
  platform_risk: 1
  platform_note: "The platform has no native merchant loyalty program (its Shop Cash is a platform cashback in the Shop app, not merchant-owned); email and review platforms (Klaviyo, Yotpo, Okendo) bundle loyalty"
  lock_in: 1
  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "BON Loyalty (Vietnam, small team), Joy (Avada, Vietnam) and Rivo (small) entered against Smile.io, Yotpo and LoyaltyLion on price ($0-25/month); customer points balances are a migration pain that protects incumbents"
  lens: "Distribution: the app store and agencies. The model release is not a threat. Switching is painful (points balances, VIP tiers), which favors incumbents. Subscription of $20-200/month by order volume (scales with the merchant); accumulation is loyalty data."

shopify-product-options-variants:
  platform_risk: 1
  platform_note: "The platform raised the variant limit from 100 to 2,048 (2024) and added Combined Listings, so part of the variants demand is covered; personalization (text, file upload, configurators with surcharges) remains for apps"
  lock_in: 1
  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "Infinite Options (small team, 2.6k reviews), Inkybay and Avis are indie; Easify, Globo, BSS and Aris are app factories (Globo leads with 13%); Bold and Hulk are mid-sized"
  lens: "Distribution: the app store. The model release is not a threat. Switching is painful (options on hundreds of products). Monetization $10-30/month, 97% with a free plan; accumulation is the option configuration."

shopify-popups-notifications:
  platform_risk: 2
  platform_note: "The platform's first-party Forms app (free, 2022) covers email and SMS capture popups; its Email app; Klaviyo and Omnisend include forms in the email platform, so the popup task is covered by the platform and bundles"
  lock_in: 0
  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "Pop Convert (small team, 8.8k reviews), Attrac and Essential Apps are indie on free plans; monetization is low ($5-30/month, 99% with a free plan)"
  lens: "Distribution: the app store. Switching is instant; low ARPU, everyone has a free plan (99%); no accumulation; the first-party app gains features with every release."

shopify-back-in-stock-preorder:
  platform_risk: 1
  platform_note: "The platform has no native 'notify me when back in stock' (its Shop app only reaches shop followers); but Klaviyo and Omnisend provide back-in-stock as a built-in trigger (bundling); preorder with partial payment is Shopify Functions without a first-party UI"
  lock_in: 0
  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "Kbite/CartBite (leader, small team, 4.1k reviews), STOQ, Timesact, REZ and Essential Apps are an indie category; the stack is webhooks plus email/SMS (commodity)"
  lens: "Distribution: the app store. The model release is not a threat. Switching is instant (the waitlist moves). Monetization $10-50/month by notification volume, 89% with a free plan; weak accumulation."

shopify-translation-currency:
  platform_risk: 2
  platform_note: "The platform's first-party Translate & Adapt (free, 2022; 1.4k reviews, #2 in the category) and Markets (multi-currency, geo-redirects, local domains) cover the task in the core; apps remain on AI translation quality and SEO localization"
  lock_in: 1
  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "Transcy (Vietnam, leader 14%), Hextom Translate (Canada, small), T Lab (indie), Langify (solo, an indie classic), Weglot (France, VC-backed)"
  lens: "Distribution: the app store. The model release is a threat (LLM translation is a commodity). Switching is painful (translations stored in metafields). Monetization $10-50/month."

shopify-seo-image-optimizer:
  platform_risk: 1
  platform_note: "The platform covers basic SEO (meta, sitemap, alt tags, a CDN with compression and WebP); apps sell audits, AI alt/meta generation, schema, speed and 'AEO/GEO' as a layer on top"
  lock_in: 0
  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "TinyIMG (small team, 2.5k reviews), SEOAnt and Plug in SEO (an indie classic) are indie; Booster Apps (mid-sized); Avada, Tapita and SearchPie are app factories with free plans"
  lens: "Distribution: the app store (Google 780/month, CPC $24, Trends 'shopify seo' UP 36 to 50). The model release is a threat (an LLM generates meta and alt text for pennies, so value shifts to audit and monitoring). Switching is instant; monetization $10-40/month, 93% with a free plan; no accumulation."

shopify-dropshipping-pod-sourcing:
  platform_risk: 1
  platform_note: "The platform's first-party dropshipping network (2023) connects Shopify stores in the US; AliExpress, Temu and CJ ship their own apps; Printful and Printify are platforms with APIs"
  lock_in: 1
  feas: {indie_exists: 0, stack_commodity: 0, no_regulated_data: 1, self_serve: 1}
  feas_note: "Leaders are logistics companies with warehouses (DSers, an official AliExpress partner; CJdropshipping, Printful, Printify, Trendsi, Zendrop with US fulfillment); the pure software layer (AutoDS, Spocket, Zopi) is VC-backed, and the value is the supplier network and delivery SLAs, not code"
  lens: "Distribution: the app store plus dropshipping YouTube creators (an audience of beginners, high churn). The model release is not a threat. Switching is painful (catalog, orders in transit). Monetization: subscription of $20-50 plus a percentage of orders; accumulation is order and supplier history."

shopify-order-tracking:
  platform_risk: 1
  platform_note: "The platform's order status page and Shop app show tracking for free; apps live on a branded tracking page, shipping-status notifications, upsells on the tracking page and invoice/packing-slip printing"
  lock_in: 0
  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "Track123 (small team, 1.7k reviews), Rush (Bulgaria, small), Wonderment (US, small), Vify Order Printer and Order Printer Pro (2 people) are indie; carrier data comes through APIs (17TRACK, TrackingMore, AfterShip), a commodity, though the data supplier is also a competitor"
  lens: "Distribution: the app store (Google 960/month, CPC $62, the most expensive Shopify niche in its batch). The model release is not a threat. Switching is instant. Monetization $10-100/month by order volume, 93% with a free plan; weak accumulation."

shopify-labels-badges:
  platform_risk: 1
  platform_note: "Online Store 2.0 themes show 'Sale' and 'Sold out' badges natively; custom labels, trust badges and payment icons are theme blocks or an app"
  lock_in: 0
  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "DECO (indie), Hoppy Trust Badges and Essential Apps are indie on free plans; BSS and Sami are app factories"
  lens: "Distribution: the app store. Switching is instant; ARPU $5-20/month, 99% with a free plan; no accumulation."

shopify-marketplace-sync:
  platform_risk: 2
  platform_note: "The platform's first-party Marketplace Connect (free up to 50 orders per month, 2023, acquired from Codisto) syncs Amazon, Walmart, eBay and Target; TikTok Shop, Facebook, Google and Pinterest are official free channels; outside the core are Etsy and niche marketplaces"
  lock_in: 1
  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "QuickSync (Etsy, small team, 2k reviews), DPL (eBay/Etsy, small) and syncX Stock Sync are indie on the tails outside Marketplace Connect; CedCommerce and LitCommerce are the mid-sized players"
  lens: "Distribution: the app store. The model release is not a threat. Switching is painful (catalog mapping, order history). Monetization $20-100/month; accumulation is mappings and rules."

shopify-reports-profit-analytics:
  platform_risk: 1
  platform_note: "The platform's analytics (updated in 2024: ShopifyQL, custom reports on Advanced plans and above) covers sales and traffic; outside the core are net profit with ad spend and COGS, LTV cohorts and session recordings (a free tool exists)"
  lock_in: 1
  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "Better Reports (Australia, indie, 1.2k reviews), Report Pundit (mid), Mipler (indie), TrueProfit and BeProfit, Lifetimely (indie, acquired in 2022: a deal), Peel; at the top Triple Whale and Northbeam (VC-backed, $300+/month)"
  lens: "Distribution: the app store plus DTC operator communities. The model release is a partial threat (AI analytics in the platform's assistant). Switching is moderate (reports and ad integrations). Monetization $20-150/month by store revenue; accumulation is history and cohorts."

shopify-bulk-edit-import:
  platform_risk: 1
  platform_note: "The platform has a native bulk editor (spreadsheet-style) and CSV import/export; apps add rollback, scheduling, metafields, filters and store-to-store migrations"
  lock_in: 1
  feas: {indie_exists: 1, stack_commodity: 1, no_regulated_data: 1, self_serve: 1}
  feas_note: "Matrixify (Estonia, 2-3 people, 1k brand queries/month, Trends UP 2 to 19) and Ablestar (US, small) are profitable indie; Hextom (Canada, small); EZ Importer (indie)"
  lens: "Distribution: the app store plus agencies and migrations (Matrixify is the standard for moving to the platform). The model release is not a threat. Switching is moderate (rules and schedules). Monetization $10-50/month (up to $200 by volume); accumulation is saved jobs."

shopify-b2b-wholesale:
  platform_risk: 1
  platform_note: "Native B2B (companies, price lists, net terms) exists only on the top plan ($2,300/month); below it apps cover B2B; the platform publicly names B2B a priority and gradually moves features down"
