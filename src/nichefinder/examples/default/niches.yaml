# Example niche catalog (niches.yaml).
#
# One entry per niche. Fields:
#   id              unique slug; used everywhere as niche_id (file names, reports, queries/*.yaml keys)
#   name            short human-readable name: "<who> — <what the product does>"
#   who             target customers
#   task            the job the product does for them
#   product         product form and typical price point
#   geo             global | ru | both   which query languages are required (global = en, ru = ru, both = en + ru)
#   side            b2b-smb | b2b | b2c | prosumer
#   tier            A = measure now; B = candidate, include on demand; C = control niche (known outcome, used to calibrate filters)
#   control         (control niches only) expected outcome: red = should be rejected as too crowded,
#                   platform = should be rejected for platform risk, green = should pass
#   sources         where the niche was found: yc | ph | tinyseed | flippa | appstore-us | appstore-ru | smartranking | g2 | report
#   evidence        facts that justify the niche (products, ranks, revenue, growth)
#   competitors     known products; names with a market hint look like "Name (RU)"
#   expertise_flag  0 | 1; 1 = needs domain expertise or licensing to build
#   notes           optional free-form caveats
#
# Search queries live in queries/*.yaml, keyed by niche id.
# Replace this catalog with your own niches, or extend it.

