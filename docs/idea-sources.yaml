# Niche Finder - registry of sources for finding and evaluating business ideas (source of truth, v1 - 2026-09-20).
# docs/idea-sources.md is generated from this file by scripts/render_idea_sources.py. Edit only this file.
# The introduction of the generated page lives in docs/idea-sources-intro.md.
#
# Entry fields:
#   group     launch | funding | community | crowdfunding | hiring | vc_portfolio | patents | m_and_a | store | search | ru_registry
#             | gov_stats | web | ads | oss | regulation | info_market
#   geo       global | ru | both
#   role      discovery  - new entities for the universe (stage group s0)
#             evaluation - a metric for a niche (s5 / s8 / s6)
#             voice      - buyer / builder voice (s10)
#             trend      - dynamics over time (s4 / s9)
#   stages    pipeline stage groups the signal goes to (s0 universe, s4 trends, s5 supply depth, s6 score/ceiling, info cohort,
#             s8 demand outside search, s9 supply over time, s10 buyer voice)
#   feeds     the columns / files the source fills (or would fill)
#   freshness realtime | daily | weekly | monthly | quarterly | static - how fast new data appears
#   status    in_pipeline (a stage exists) | planned (no stage yet) | manual (hand / browser only)
#             | blocked (no access from the probing network) | paid (paid access only)
#   adapter   name of the stage module in src/nichefinder/stages/ that fetches the source, or null = not implemented
#   priority  P1 (implement first) | P2 (next) | P3 (on demand / one niche only) | none (not worth doing)
#   access[]  ways to get the data; probe = result of a keyless curl probe on the stated date.
#             Codes: 200 - open; 401 - key required; 403 - Cloudflare / geo / WAF; 000 - connection not established
#             (retry from another network). A probe is a dated fact, not a guarantee: re-probe before relying on it.

version: 2026-09-20

groups:
  launch: "Launch platforms - what is entering the market now (rising)"
  funding: "Funding and rounds - where the money goes (rising; expensive confirmation of demand)"
  community: "Communities - buyer and builder voice (voice)"
  crowdfunding: "Crowdfunding - a pre-order as demand before the product (B2C hardware / consumer)"
  hiring: "Hiring - who hires for which tasks (a proxy for budget and growth)"
  vc_portfolio: "Fund portfolios - a map of what is already funded (rising; a red ocean a year later)"
  patents: "Patents - R&D activity and abandoned directions (feasibility / IP risk)"
  m_and_a: "Business sales - deals, multiples, real revenue of small players (proven, transactions)"
  store: "App and plugin stores - supply and concentration (proven)"
  search: "Search demand - volumes, CPC, trend"
  ru_registry: "Russian registries and open government data - Russian B2B branch"
  gov_stats: "Official business statistics - how many buyers of a kind exist (the who of a B2B niche)"
  web: "Web footprint - how old competitors' sites are, who went quiet, how much traffic they get"
  ads: "Ad libraries and ad-account forecasts - acquisition cost and who pays for traffic"
  oss: "Open source - free substitutes that cap willingness to pay"
  regulation: "Regulations - compliance deadlines that create demand before it shows in search"
  info_market: "Paid information products - whether people pay for knowledge on a topic"

sources:

  # ══════════════════════════════════════════════════════════════════════════
  # LAUNCH - launch platforms
  # ══════════════════════════════════════════════════════════════════════════

  - id: product_hunt
    name: Product Hunt
    group: launch
    geo: global
    url: https://www.producthunt.com
    role: [discovery, evaluation]
    signals:
      - "new products for a period: name, tagline, topics, votes - who is launching and with what"
      - "launch density per topic over 12 months -> ph_launches_12m (s5 deals / liquidity)"
      - "repeat launches of one product (v2, v3) - a sign of a live market"
    stages: [s0, s5]
    feeds: ["data/out/universe.csv (source=ph:*, rising)", "data/out/deals.csv: ph_launches_12m"]
    freshness: daily
    status: in_pipeline
    adapter: s0_producthunt
    priority: P2
    access:
      - method: graphql
        endpoint: "https://api.producthunt.com/v2/api/graphql  posts(featured: true, order: VOTES, postedAfter, postedBefore, first: 20)"
        auth: "developer token PRODUCTHUNT_TOKEN (free, register an application at producthunt.com/v2/oauth/applications)"
        cost: $0
        limits: "query complexity <= 6,250 / 15 min; s0_producthunt waits for the reset on a rate-limit answer; the API terms restrict commercial use without permission from Product Hunt"
        probe: {date: 2026-11-20, http: 200, note: "first run of s0_producthunt: 1,056 unique featured posts over 12 months (votes 213-1,496, all with topics); one rate-limit wait of ~8 min"}
      - method: html_ssr
        endpoint: "https://www.producthunt.com/leaderboard/{monthly|weekly}/{y}/{m}/all"
        auth: none
        cost: $0
        limits: "Cloudflare JavaScript challenge; a browser User-Agent does not help, only a real browser would"
        probe: {date: 2026-11-17, http: 403, note: "'Just a moment...' on every page; 200 on 2026-09-20"}
      - method: atom
        endpoint: "https://www.producthunt.com/feed  (?category=<topic-slug>)"
        auth: none
        cost: $0
        limits: "50 latest posts; has title, tagline, published, link; no votes and no topics"
        probe: {date: 2026-09-20, http: 200, note: "44 KB, 50 entries, the freshest - a daily pulse"}
      - method: html_ssr
        endpoint: "https://www.producthunt.com/topics/<slug>"
        auth: none
        cost: $0
        limits: "topic page: number of followers and products of the topic - the size of the category audience"
        probe: {date: 2026-09-20, http: 200, note: "606 KB SSR"}
    caveats:
      - "Votes are bought or inflated; the signal is the number of launches and repeats, not votes"
      - "Biased toward AI wrappers and dev tools; SMB B2B verticals are poorly represented"
      - "Up to 4 topics per post, labelled by the authors - matching to a niche needs regexes (deal_keywords.yaml)"
      - "Since November 2026 the web pages answer automated clients with a Cloudflare challenge (leaderboards checked; the feed and topic pages are likely the same): use the API"
    plan: "Done (2026-11-20): s0_producthunt reads the GraphQL API (top 60 featured posts a month and top 20 a week, 12 months). Next: a per-topic slice (posts(topic: ...)) for shortlisted niches"

  - id: product_radar
    name: Product Radar (RU)
    group: launch
    geo: ru
    url: https://productradar.ru
    role: [discovery]
    signals:
      - "Russian-language launches: name, description, category, awards (product of the week / month), number of comments"
      - "categories 'looking for a partner / investor / mentor' - who has not found a model yet"
      - "slices ?groupby=week|month|year|base - what won in a category over a period"
    stages: [s0, s5]
    feeds: ["data/out/universe.csv (source=productradar, rising, geo=ru)", "data/out/deals.csv: productradar_12m (passport, not scored)"]
    freshness: daily
    status: in_pipeline
    adapter: s0_productradar
    priority: P2
    access:
      - method: html_ssr
        endpoint: "https://productradar.ru/wp-admin/admin-ajax.php  POST action=more-handler&next_period=<months back>&next_page=<n>&group_by=month (15 cards per page); also https://productradar.ru/category/<cat>/<subcat>/?groupby=month|year|base"
        auth: none
        cost: $0
        limits: "WordPress theme vchunt; cards article.products__item: card__title, card__description, awards, comments; the product post type is hidden from REST"
        probe: {date: 2026-09-20, http: 200, note: "78 KB, 8 products on a category page; REST /wp-json/wp/v2/product -> 404 (rest_no_route), only posts/blog"}
      - method: rss
        endpoint: "https://productradar.ru/feed"
        auth: none
        cost: $0
        limits: "blog only (10 entries), not launches"
        probe: {date: 2026-09-20, http: 200, note: "187 KB RSS, blog / streams - useless for the universe"}
    caveats:
      - "Small volume (tens of launches a month) - weak as a source of niches, useful as an indicator of Russian competitors in a chosen niche"
      - "No revenue metrics; voting is done by platform residents"
    plan: "Done (2026-11-17): s0_productradar reads the monthly feed through admin-ajax (action=more-handler, group_by=month; ~40 launches a month) over curl, because the TLS chain fails Python's check. Next: one walk of ?groupby=base for the full base"

  - id: betalist
    name: BetaList
    group: launch
    geo: global
    url: https://betalist.com
    role: [discovery]
    signals:
      - "products BEFORE launch (beta): name, tagline, topics - a window of 3-6 months before Product Hunt"
      - "density of beta submissions per topic - where new founders are heading"
    stages: [s0, s5]
    feeds: ["data/out/universe.csv (source=betalist, rising)", "data/out/deals.csv: betalist_12m (passport, not scored)"]
    freshness: daily
    status: in_pipeline
    adapter: s0_betalist
    priority: P1
    access:
      - method: html_ssr
        endpoint: "https://betalist.com/startups?page=N  (chronological, ~50 startups per page under day headings data-duplicate-id=day_<unix>); categories moved to /browse/<cat>/<sub>"
        auth: none
        cost: $0
        limits: "55 startups on the home page, 21 on a topic page; links /startups/<slug>, a card is name + tagline + topics; /feed and /startups -> 404"
        probe: {date: 2026-11-17, http: 200, note: "/startups?page=N works (250-270 KB, 50 rows with name + tagline); /topics/* is gone, replaced by /browse/*"}
    caveats:
      - "Many 'ideas without a product'; ~50% never launch - that is a feature (it shows intentions), but mark them source_type=rising/pre in the universe"
      - "No numbers (votes / subscribers) in a card - only the fact and the date"
    plan: "Done (2026-11-17): s0_betalist walks /startups?page=N newest first for 12 months (~110 pages, ~5,300 startups); s5_deals counts betalist_12m per niche. Next: dedupe against Product Hunt by domain"

  - id: launching_next
    name: Launching Next
    group: launch
    geo: global
    url: https://www.launchingnext.com
    role: [discovery]
    signals:
      - "daily launches (mostly micro-SaaS, indie, no-code): name, description, date"
    stages: [s0]
    feeds: ["data/out/universe.csv (source=launchingnext, rising)"]
    freshness: daily
    status: planned
    adapter: null
    priority: P2
    access:
      - method: rss
        endpoint: "https://www.launchingnext.com/rss/"
        auth: none
        cost: $0
        limits: "15 latest entries; title, link (/s/<slug>/<id>/), pubDate, description"
        probe: {date: 2026-09-20, http: 200, note: "7 KB RSS, 15 items, fresh within a day (2026-09-19)"}
      - method: html_ssr
        endpoint: "https://www.launchingnext.com/  (categories and archive via /s/<slug>/<id>/ - the id is monotonic, ~152,000 on 2026-09-20)"
        auth: none
        cost: $0
        limits: "33 KB, static HTML; the archive is walked by id"
        probe: {date: 2026-09-20, http: 200, note: "open"}
    caveats:
      - "Low quality (paid placements, SEO sites); the value is only volume and freshness. Match to niches with regexes, do not read by hand"
    plan: "Collect the RSS daily into a cache (accumulate), merge into the universe once a month; use as a third 'launch density' counter (PH + BetaList + LN)"

  - id: indie_hackers
    name: Indie Hackers
    group: community
    geo: global
    url: https://www.indiehackers.com
    role: [discovery, voice]
    signals:
      - "products with confirmed revenue (Stripe-verified) -> proven-fragmented niches of small players"
      - "'how I got to $X MRR' posts - monetization model, channels, time to revenue"
      - "interviews - what did not work"
    stages: [s0, s5]
    feeds: ["data/out/universe.csv (source=ih, proven)", "data/out/deals.csv: ih_products (idea)"]
    freshness: daily
    status: manual
    adapter: null
    priority: P3
    access:
      - method: html_spa
        endpoint: "https://www.indiehackers.com/products?revenueVerification=stripe&sorting=highest-revenue"
        auth: none
        cost: $0
        limits: "SPA: only 19 /product/* links in the HTML, revenue is rendered by JS; the API is closed; /product/<slug> -> 404 for some slugs"
        probe: {date: 2026-09-20, http: 200, note: "81 KB shell without data; /feed.xml is HTML, /rss -> 404"}
      - method: browser
        endpoint: "the same list through a headless browser (Playwright) or by hand: export the 'Products' table with the revenue filter"
        auth: none
        cost: "$0, ~30 min by hand per slice"
        limits: "a one-off slice of ~1,000 products with MRR"
        probe: {date: 2026-09-20, http: null, note: "not tried"}
    caveats:
      - "Verified revenue is rare (~20% of products); the rest is self-reported"
      - "Biased toward dev / SaaS tools for indies - the same niches as Product Hunt"
    plan: "One manual / headless slice of Stripe-verified products -> universe (proven); repeat quarterly"

  # ══════════════════════════════════════════════════════════════════════════
  # FUNDING - funding, rounds
  # ══════════════════════════════════════════════════════════════════════════

  - id: crunchbase
    name: Crunchbase
    group: funding
    geo: global
    url: https://www.crunchbase.com
    role: [evaluation]
    signals:
      - "rounds per company / category: amount, date, investors -> 'how much money entered the niche in 24 months'"
      - "number of funded companies in a category -> capital concentration (many small rounds = fragmentation; one mega-round = a future monopolist)"
      - "Crunchbase News - fresh rounds as text (a weak substitute for the API)"
    stages: [s5, s6]
    feeds: ["data/out/supply_deep.csv: funding_24m, funded_cos (idea, only with paid access)"]
    freshness: daily
    status: paid
    adapter: null
    priority: P3
    access:
      - method: api
        endpoint: "https://api.crunchbase.com/api/v4/  (searches/organizations, funding_rounds)"
        auth: "user_key - only on the Pro / Enterprise plan (~$49-99/month for Pro without API; the API is separate, from ~$1k/month)"
        cost: "paid"
        limits: "without a key 401 LA401"
        probe: {date: 2026-09-20, http: 401, note: "Unauthorized user_key"}
      - method: html
        endpoint: "https://www.crunchbase.com/discover/... and /hub/..."
        auth: none
        cost: $0
        limits: "Cloudflare 403 on any request without a browser"
        probe: {date: 2026-09-20, http: 403, note: "blocked"}
      - method: rss
        endpoint: "https://news.crunchbase.com/feed/"
        auth: none
        cost: $0
        limits: "news about rounds (tens a day), text - extract company / amount / category with a regex or an LLM"
        probe: {date: 2026-09-20, http: 200, note: "106 KB RSS, open"}
    caveats:
      - "Expensive for the signal it gives: for SMB niches worth '$5-10M', VC rounds are more of a counter-indication than a plus"
      - "Free replacements: for the fact of money raised in the US - SEC Form D (see sec_form_d); for 'who is building what' - YC / Product Hunt / BetaList"
    plan: "Not worth buying. Accumulate the Crunchbase News RSS in a cache and once a month run niche regexes over it -> a funding_news_12m column in the passport as a reference"

  - id: dealroom
    name: Dealroom
    group: funding
    geo: global
    url: https://dealroom.co
    role: [evaluation]
    signals:
      - "same as Crunchbase, with a focus on Europe; segment reports (open reports per vertical)"
    stages: [s5]
    feeds: []
    freshness: daily
    status: paid
    adapter: null
    priority: none
    access:
      - method: api
        endpoint: "https://api.dealroom.co/api/v2/"
        auth: "API key - corporate plan only"
        cost: "paid"
        limits: "both app.dealroom.co and the API sit behind a Cloudflare 'Just a moment' page without a browser"
        probe: {date: 2026-09-20, http: 403, note: "Cloudflare"}
      - method: manual
        endpoint: "https://dealroom.co/reports  (PDF reports per sector / country, free after a form)"
        auth: email
        cost: $0
        limits: "quarterly reviews, not data"
        probe: {date: 2026-09-20, http: 200, note: "blog open (HTML), no RSS"}
    caveats:
      - "Duplicates Crunchbase; gives little for SMB / prosumer niches. Useful only for reading vertical reports once a niche is chosen"
    plan: "Not worth implementing. Read the reports by hand when studying a chosen niche"

  - id: pitchbook
    name: PitchBook
    group: funding
    geo: global
    url: https://pitchbook.com
    role: [evaluation, trend]
    signals:
      - "the fullest base of rounds / M&A / multiples; 'Emerging Spaces' - new segments according to analysts"
      - "free: PitchBook-NVCA Venture Monitor (quarterly PDF) - volumes by stage and sector"
    stages: [s6]
    feeds: []
    freshness: quarterly
    status: paid
    adapter: null
    priority: none
    access:
      - method: html
        endpoint: "https://pitchbook.com/news, /news/reports, /rss"
        auth: none
        cost: $0
        limits: "Cloudflare 403 on everything, including RSS"
        probe: {date: 2026-09-20, http: 403, note: "Cloudflare 'Just a moment'"}
      - method: manual
        endpoint: "https://nvca.org/research/pitchbook-nvca-venture-monitor/  (PDF)"
        auth: none
        cost: $0
        limits: "once a quarter, macro level (sectors, not niches)"
        probe: {date: 2026-09-20, http: 200, note: "NVCA page open, PDF behind a link"}
    caveats:
      - "A subscription from ~$20k/year is out of scale for a small tool. For the revenue-ceiling estimate only public SaaS M&A multiples are useful (free in reports)"
    plan: "Not worth implementing. Read the Venture Monitor quarterly to calibrate ceiling assumptions (multiples, volumes by stage)"

  - id: sec_form_d
    name: SEC EDGAR - Form D (US private placements)
    group: funding
    geo: global
    url: https://www.sec.gov/edgar
    role: [evaluation]
    signals:
      - "every round raised in the US (> $0) must file a Form D: issuer, amount, date, industryGroupType (Other Technology, Business Services...) - a free Crunchbase for the fact of money, without a product description"
      - "number of new Form D filings by a keyword in the name / industry over 12 months -> 'how many companies in the niche raised money'"
    stages: [s5]
    feeds: ["data/out/deals.csv: formd_12m (idea)"]
    freshness: daily
    status: blocked
    adapter: null
    priority: P3
    access:
      - method: bulk_index
        endpoint: "https://www.sec.gov/Archives/edgar/full-index/{YYYY}/QTR{n}/form.idx  (+ /Archives/edgar/data/<cik>/<accession>.txt - XML Form D)"
        auth: "a User-Agent with a contact is mandatory (SEC rule), <= 10 requests/s"
        cost: $0
        limits: "the index is 42 MB per quarter; 2026-Q3: 9,063 Form D + 4,996 D/A; the index holds only the issuer name, CIK, date -> to get the amount and industry, every XML must be downloaded"
        probe: {date: 2026-09-20, http: 200, note: "index open from the probing machine"}
      - method: fulltext_api
        endpoint: "https://efts.sec.gov/LatestSearch/?q=<phrase>&forms=D&startdt=..."
        auth: "a User-Agent with a contact"
        cost: $0
        limits: "full-text search by name and fields - the most convenient path, but"
        probe: {date: 2026-09-20, http: 403, note: "Forbidden from the probing IP even with a correct UA (SEC geo filter) - retry from another network"}
    caveats:
      - "The issuer name is often a legal entity (Acme Holdings LLC), not the brand; matching to a niche works only through the name -> low recall"
      - "Industry has 30 coarse classes; 'Other Technology' = all software. The signal is useful as a counter over competitor names from a niche passport, not as a niche discovery tool"
    plan: "If efts opens from another network, a stage could search Form D filings over 24 months for the competitors of each niche -> funded, amount. Otherwise skip"

  - id: yc_oss
    name: Y Combinator (yc-oss JSON)
    group: funding
    geo: global
    url: https://yc-oss.github.io/api/
    role: [discovery, evaluation]
    signals: ["YC companies by batch: industry, one_liner, team_size, tags - rising entities; yc_companies in deals.csv"]
    stages: [s0, s5]
    feeds: ["data/out/universe.csv (source=yc:*)", "data/out/deals.csv: yc_companies"]
    freshness: quarterly
    status: in_pipeline
    adapter: s0_yc
    priority: P2
    access:
      - method: json
        endpoint: "https://yc-oss.github.io/api/batches/<batch>.json"
        auth: none
        cost: $0
        limits: "updated with every batch"
        probe: {date: 2026-09-15, http: 200, note: "1,157 companies W25-F26"}
    caveats: ["YC only; strong bias toward AI infrastructure in 2025-26"]
    plan: "Add new batches as they come out"

  - id: tinyseed
    name: TinySeed (portfolio)
    group: funding
    geo: global
    url: https://tinyseed.com/portfolio
    role: [discovery, evaluation]
    signals: ["B2B SaaS for small teams with revenue - the best prior for proven-fragmented; tinyseed in deals.csv"]
    stages: [s0, s5]
    feeds: ["data/out/universe.csv (source=tinyseed)", "data/out/deals.csv: tinyseed"]
    freshness: quarterly
    status: in_pipeline
    adapter: s0_tinyseed
    priority: P3
    access:
      - method: manual
        endpoint: "https://tinyseed.com/portfolio"
        auth: none
        cost: $0
        limits: "215 companies (2026-09-15); refresh twice a year; exported by hand to a CSV that the stage reads"
        probe: {date: 2026-09-15, http: 200, note: "exported by hand"}
    caveats: []
    plan: "Add analogues by hand: Calm Company Fund (/portfolio -> 404, the path changed), Indie.vc, Earnest"

  # ══════════════════════════════════════════════════════════════════════════
  # COMMUNITY - buyer and builder voice
  # ══════════════════════════════════════════════════════════════════════════

  - id: hacker_news
    name: Hacker News (Algolia API)
    group: community
    geo: global
    url: https://news.ycombinator.com
    role: [discovery, voice, trend]
    signals:
      - "Show HN by niche keywords over a period -> new products from technical people (rising, earlier than Product Hunt)"
      - "Ask HN 'is there a tool for / how do you handle X' -> pain without a product (voice)"
      - "dynamics of niche mentions per month (points, num_comments) -> interest of the technical audience"
      - "'Who is hiring?' / 'Who wants to be hired?' - monthly threads (see hn_who_is_hiring)"
    stages: [s8]
    feeds: ["data/out/hn_niche.csv, data/out/hn_matches.csv", "data/out/offsearch.csv: hn_posts_12m, hn_show_12m, hn_ask_12m, hn_trend (flags HN:up / HN:down / HN:asks)"]
    freshness: realtime
    status: in_pipeline
    adapter: s8_hn_mentions
    priority: P1
    access:
      - method: api
        endpoint: "https://hn.algolia.com/api/v1/search?query=<phrase>&tags=story|show_hn|ask_hn&numericFilters=created_at_i>...&hitsPerPage=1000"
        auth: none
        cost: $0
        limits: "10,000 requests/h, no key; full text over title / story_text / comment_text; filters by date and type; search_by_date for chronology"
        probe: {date: 2026-09-20, http: 200, note: "JSON, works; 'Show HN invoicing' for 2026 has hits"}
      - method: api
        endpoint: "https://hacker-news.firebaseio.com/v0/item/<id>.json"
        auth: none
        cost: $0
        limits: "official API: comment tree by id; no search"
        probe: {date: 2026-09-20, http: 200, note: "topstories.json open"}
    caveats:
      - "Algolia matches words loosely by default ('dog grooming' -> 341 stories, 3 relevant): use a quoted phrase, typoTolerance=false and restrictSearchableAttributes=title"
      - "The audience is developers; B2C niches (gardeners, churches, tattoo) are barely represented -> NA, not 0"
      - "Full text catches homonyms ('church' in a non-religious sense) - the same traps as in query generation; a stop-context list per niche is needed"
    plan: "Done (2026-11-17): s8_hn_mentions searches the Latin coverage phrases of each shortlisted niche as exact phrases in titles of Show HN + Ask HN posts (typoTolerance=false, restrictSearchableAttributes=title) and keeps titles that match the niche regex. Plain stories and post bodies were tried and dropped: about 9 in 10 hits were homonyms. Next: pain-bearing Ask HN threads into the s10 corpus"

  - id: reddit
    name: Reddit (Arctic Shift + subredditstats)
    group: community
    geo: global
    url: https://www.reddit.com
    role: [voice, trend]
    signals: ["s8: size and growth of native subreddits; s10: pains, products, 'from -> to', willingness to pay across thousands of labelled documents"]
    stages: [s8, s10]
    feeds: ["data/out/reddit_niche.csv", "data/out/reddit_voice*.csv|json", "data/out/reddit_brands.csv", "data/out/reddit_monthly.csv"]
    freshness: daily
    status: in_pipeline
    adapter: s10_reddit_fetch
    priority: P2
    access:
      - method: api
        endpoint: "https://arctic-shift.photon-reddit.com/api/posts/search?subreddit=...&after=...&before=...&limit=100"
